<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scanner benchmark</title>
    <style>
      body {
        font:
          14px ui-monospace,
          monospace;
        background: #0d1117;
        color: #e6edf3;
        padding: 16px;
      }
      h3 {
        margin: 0 0 4px;
      }
      p.hint {
        color: #8b949e;
        margin: 0 0 12px;
      }
      table {
        border-collapse: collapse;
        margin: 8px 0 16px;
      }
      td,
      th {
        border: 1px solid #30363d;
        padding: 4px 10px;
        text-align: right;
      }
      th,
      td:first-child {
        text-align: left;
      }
      button {
        font: inherit;
        background: #21262d;
        color: #e6edf3;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .bar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      #log {
        white-space: pre-wrap;
        margin-bottom: 12px;
      }
      .dim {
        color: #8b949e;
      }
    </style>
  </head>
  <body>
    <h3>Card scanner benchmark</h3>
    <p class="hint">
      Times this browser's pipeline over the apps/mobile-example benchmark
      photos. The search backend must be running.
    </p>
    <div class="bar">
      <button id="run">Run benchmark</button>
      <button id="save" disabled>Save JSON</button>
      <button id="copy" disabled>Copy JSON</button>
      <span class="dim" id="params"></span>
    </div>
    <div id="log">idle</div>
    <div id="results"></div>
    <script type="module" src="/src/tools/bench.ts"></script>
  </body>
</html>
